# KeyBridge settings. One "Key = value" per line; lines starting with # are comments.
# Changes apply the next time you start KeyBridge.

# Keyboard layout configured on the device you type INTO (it decides what each key means):
#   us      US English (any operating system)
#   es-mac  Spanish on macOS ("Spanish - ISO")
# Ctrl+L switches layout while KeyBridge runs.
HostLayout = us

# Name the other device sees when pairing.
DeviceName = KeyBridge

# Pointer speed on the other device (1.0 = as on the laptop; e.g. 0.6 slower, 1.5 faster).
MouseSpeed = 1.0

# WSL distribution to use (empty = your default one). Must be Debian/Ubuntu/Kali based.
Distro =

# USB id of the Bluetooth adapter as shown by "usbipd list", e.g. 0e8d:223c (empty = detect it).
AdapterId =

# Local TCP port between the touchpad helper (Windows) and KeyBridge (WSL).
MousePort = 47321
